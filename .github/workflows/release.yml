name: Universal Cross-Platform Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: seclens-mcp
            asset_name: seclens-mcp-linux-x86_64.tar.gz
            use_cross: false

          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: seclens-mcp
            asset_name: seclens-mcp-linux-x86_64-musl.tar.gz
            use_cross: false
            install_musl: true

          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact_name: seclens-mcp
            asset_name: seclens-mcp-linux-aarch64.tar.gz
            use_cross: true

          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: seclens-mcp
            asset_name: seclens-mcp-darwin-x86_64.tar.gz
            use_cross: false

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: seclens-mcp
            asset_name: seclens-mcp-darwin-aarch64.tar.gz
            use_cross: false

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: seclens-mcp.exe
            asset_name: seclens-mcp-windows-x86_64.zip
            use_cross: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools
        if: matrix.install_musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Target Binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --manifest-path src/Cargo.toml
          else
            cargo build --release --target ${{ matrix.target }} --manifest-path src/Cargo.toml
          fi
        shell: bash

      - name: Package Artifact (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd src/target/${{ matrix.target }}/release
          tar -czf ../../../../${{ matrix.asset_name }} ${{ matrix.artifact_name }}
          cd ../../../..
          shasum -a 256 ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
        shell: bash

      - name: Package Artifact (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd src\target\${{ matrix.target }}\release
          Compress-Archive -Path ${{ matrix.artifact_name }} -DestinationPath ..\..\..\..\${{ matrix.asset_name }} -Force
          cd ..\..\..\..
          Get-FileHash -Algorithm SHA256 ${{ matrix.asset_name }} | Out-File -FilePath "${{ matrix.asset_name }}.sha256"
        shell: powershell

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
